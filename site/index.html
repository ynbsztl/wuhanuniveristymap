<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b45">
  <meta name="description" content="在地图上打开武汉大学的校园影像，记录每个地点的日常。个人摄影地图，非学校官方网站。">
  <title>武汉影像地图 · Wuhan PHOTO ATLAS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123b45'/%3E%3Cpath d='M16 5a8 8 0 0 0-8 8c0 6 8 14 8 14s8-8 8-14a8 8 0 0 0-8-8' fill='%23ec8b54'/%3E%3Ccircle cx='16' cy='13' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="武汉影像地图首页"><span class="brand-mark" aria-hidden="true">珞</span><span><strong>武汉影像地图</strong><small>Wuhan PHOTO ATLAS</small></span></a>
    <p class="header-note">用照片，留下校园的日常</p>
    <span class="personal-label">个人影像计划</span>
  </header>
  <main class="workspace">
    <aside class="sidebar" aria-label="地点与相册">
      <section id="overview">
        <p class="eyebrow">EXPLORE WUHAN</p>
        <h1>一张地图，<br>走进武汉。</h1>
        <p class="intro">点击地图上的拍摄点，看看那里的光影与日常。</p>
        <div class="section-title"><h2>已记录的地点</h2><span id="place-count">—</span></div>
        <div id="place-list" aria-live="polite"><p class="loading">正在载入校园影像…</p></div>
        <div class="field-note"><span aria-hidden="true">＋</span><p>地图还在慢慢生长。<br>每一次拍摄，都是一个新的坐标。</p></div>
      </section>
      <section id="detail" hidden aria-labelledby="place-title">
        <div class="detail-top"><button id="back" class="text-button" type="button">所有地点</button><span id="detail-count"></span></div>
        <p id="place-area" class="eyebrow"></p>
        <h2 id="place-title" tabindex="-1"></h2>
        <p id="place-description" class="intro"></p>
        <div id="photos"></div>
        <p id="coordinate-note" class="coordinate-note"></p>
      </section>
      <footer class="sidebar-footer"><span>摄影与制作 · Tianlei Zhang</span><span>非武汉大学官方网站</span></footer>
    </aside>
    <section class="map-wrap" aria-label="校园地图">
      <div class="map-toolbar"><label for="area">浏览范围</label><select id="area"><option value="all">全校视野</option><option value="museum">武汉博物馆（校外）</option><option value="zoo">武汉动物园（校外）</option><option value="arts">文理学部</option><option value="engineering">工学部</option><option value="information">信息学部</option><option value="medicine">医学部</option></select><button id="reset-map" type="button" title="返回全校视野" aria-label="返回全校视野">◎</button></div>
      <div id="map" aria-label="武汉大学互动地图，选择标记查看照片"></div>
      <p id="map-status" class="map-status" role="status">正在加载地图…</p>
      <div class="map-legend"><span class="legend-dot"></span>有照片的地点<span class="legend-divider"></span>点击标记看相册</div>
      <div class="map-caption" aria-hidden="true"><span>珞珈山 · 东湖畔</span><small>WUHAN, CHINA</small></div>
    </section>
  </main>
  <dialog id="lightbox" aria-label="照片大图">
    <button id="close-lightbox" class="close-lightbox" type="button" aria-label="关闭大图">关闭 ×</button>
    <img id="large-photo" alt="">
    <div class="lightbox-bottom"><button id="previous" type="button" aria-label="上一张照片">上一张</button><p id="large-caption" aria-live="polite"></p><button id="next" type="button" aria-label="下一张照片">下一张</button></div>
  </dialog>
  <noscript><p class="noscript">请启用 JavaScript 使用互动地图。照片仍保存在本站相册中。</p></noscript>
</body>
</html>
